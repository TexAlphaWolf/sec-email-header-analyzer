name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov

  evaluation:
    name: measured quality (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: DKIM, SPF, Ed25519, RSA, PSL against independent implementations
        run: |
          python tools/evaluate.py | tee eval.txt
          tail -n 1 eval.txt | grep -qx OK

  windows:
    # The sample messages must keep their CRLF line endings on Windows too.
    name: test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  live-dns:
    # Real DNS: SPF against pyspf for well-known domains, DMARC records, published DKIM keys.
    name: real DNS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: |
          python tools/live_check.py | tee live.txt
          tail -n 1 live.txt | grep -qx OK

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mailhdr .
      - name: Analyse a mounted message, offline, as an ordinary user
        run: |
          docker run --rm -v "$PWD/examples:/mail:ro" mailhdr analyze /mail/03-lookalike-domain.eml --offline --brands /mail/brands.txt --format json > out.json
          python3 -c "import json; d=json.load(open('out.json')); assert d['offline'] and any(f['code']=='from-typosquat' for f in d['findings'])"
      - name: Standard input and the bundled zone
        run: |
          docker run --rm -i mailhdr analyze - --zone /app/examples/zone.json --brands /app/examples/brands.txt --fail-on high < examples/02-spoofed-sender.eml || [ $? -eq 1 ]
