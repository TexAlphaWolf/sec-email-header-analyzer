[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailhdr"
version = "1.0.0"
description = "Analyses an email's headers: delivery path, SPF, DKIM and DMARC re-checked from scratch, and signs of spoofing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# DNS lookups use dnspython. Everything else (header parsing, DKIM with its RSA and Ed25519
# maths, SPF, DMARC) is standard library, and runs offline against a saved zone file.
dependencies = ["dnspython>=2.6"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
  "mypy>=1.10",
  "cryptography>=43",  # tests only: makes keys and signatures to check the verifier against
  "dkimpy>=1.1",       # tests only: an independent DKIM signer and verifier
  "pynacl>=1.5",       # tests only: lets dkimpy make Ed25519 signatures
  "pyspf>=2.0",        # tests only: an independent SPF implementation
  "playwright>=1.45",  # only to render the README screenshot
]

[project.scripts]
mailhdr = "mailhdr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailhdr = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["mailhdr"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["dns", "dns.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/*" = ["E501"]
"src/mailhdr/lookalike.py" = ["E501", "RUF001"]  # the table of look-alike letters is the point
"tests/*" = ["E501", "RUF001"]
"tools/*" = ["E501", "E402"]
